# Nginx server block for ai.sitesnsign.com — a NEW subdomain on the same
# VPS that already fronts sitesnsign.com (the founder's separate,
# unrelated real-estate site). See deploy/README.md for exactly where to
# drop this file given how the existing Nginx setup is organized, and the
# certbot command to run once DNS is pointed here.
#
# Proxies to the ai-calling-agent Docker Compose project's containers
# (docker-compose.prod.yml, repo root) BY SERVICE NAME over its own
# `ai-calling-agent-net` Docker network — Nginx itself runs on the VPS
# host (not inside that network), so it reaches them via the container
# ports Docker publishes to the host's loopback. If your Docker setup
# instead runs Nginx as its OWN container, see the note at the bottom of
# this file on joining `ai-calling-agent-net` instead of using
# 127.0.0.1:<port>.
#
# IMPORTANT: docker-compose.prod.yml deliberately does NOT publish
# web/voice-gateway's ports to the host (`expose`, not `ports`) for
# isolation from the sitesnsign.com stack. For Nginx-on-the-host (this
# file's default assumption) to reach them, EITHER:
#   (a) add `ports: ["127.0.0.1:3000:3000"]` / `["127.0.0.1:8100:8100"]`
#       to the `web`/`voice-gateway` services (loopback-only — never
#       `0.0.0.0:` — so they're still unreachable from the internet
#       directly, only from Nginx on the same host), or
#   (b) run Nginx itself as a container joined to `ai-calling-agent-net`
#       and proxy to `http://web:3000` / `http://voice-gateway:8100` by
#       service name instead of `127.0.0.1:<port>` below.
# This file assumes (a) — the more common setup when Nginx already runs
# directly on the VPS for sitesnsign.com. Swap the upstream targets below
# if you're doing (b).

upstream ai_calling_agent_web {
    server 127.0.0.1:3000;
}

upstream ai_calling_agent_voice_gateway {
    server 127.0.0.1:8100;
}

# --- HTTP (port 80): certbot's HTTP-01 challenge + redirect to HTTPS ------
server {
    listen 80;
    listen [::]:80;
    server_name ai.sitesnsign.com;

    # certbot --nginx (see deploy/README.md) edits this block in place to
    # add its challenge location automatically the first time it runs, but
    # having it here already means `certbot certonly`/`--webroot` modes
    # also work without editing this file by hand first.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot; # create this dir if it doesn't exist: mkdir -p /var/www/certbot
        allow all;
    }

    # Everything else: once a cert exists, redirect to HTTPS. Until then
    # (first deploy, before certbot has run), comment this out and let
    # `location /` proxy directly to `web` over plain HTTP so you can
    # smoke-test before SSL is live — see deploy/RUNBOOK.md step 8.
    location / {
        return 301 https://$host$request_uri;
    }
}

